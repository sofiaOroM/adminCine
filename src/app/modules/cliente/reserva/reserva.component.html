<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h4 class="text-primary text-center mb-3">Reserva de Boletos</h4>

            <p><strong>Película:</strong> {{ getPeliculaTitulo() }}</p>
            <p><strong>Sala:</strong> {{ getSalaNombre() }}</p>
            <p><strong>Fecha:</strong> {{ funcion?.fecha }} - {{ funcion?.hora }}</p>
            <p><strong>Precio:</strong> Q{{ funcion?.precio }}</p>

            <form (ngSubmit)="reservar()">
                <div class="mb-3">
                    <label class="form-label">Nombre del cliente:</label>
                    <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad de boletos:</label>
                    <input type="number" class="form-control" [(ngModel)]="cantidad" name="cantidad" required min="1">
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success me-2">Confirmar</button>
                    <button type="button" class="btn btn-secondary" (click)="router.navigate(['/cliente/cartelera'])">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

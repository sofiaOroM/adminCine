<div class="container py-4" *ngIf="sala">

    <div class="card shadow-lg">

        <div class="card-body">
            <h3 class="card-title text-primary">Sala {{ sala.nombre }}</h3>
            <p><strong>Capacidad:</strong> {{ sala.capacidad }}</p>
            <p *ngIf="sala.numero"><strong>Número de sala:</strong> {{ sala.numero }}</p>
            <p *ngIf="sala.descripcion"><strong>Descripción:</strong> {{ sala.descripcion }}</p>
            <p *ngIf="sala.cine"><strong>Cine:</strong> {{ sala.cine?.nombre }}</p>
        </div>

        <hr>

        <app-comentarios-sala [salaId]="sala.id"></app-comentarios-sala>

    </div>

</div>

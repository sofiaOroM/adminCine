<div class="card shadow-sm p-4">
    <h4 class="text-primary mb-4">Cines y Salas</h4>

    <div *ngFor="let cine of cines" class="mb-4 border rounded p-3">
        <h5>{{ cine.nombre }}</h5>
        <p class="text-muted">{{ cine.direccion }}</p>

        <h6 class="mt-3">Salas:</h6>

        <table class="table table-sm table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Capacidad</th>
                    <th>Opciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let sala of salasPorCine[cine.id]">
                    <td>{{ sala.id }}</td>
                    <td>{{ sala.nombre }}</td>
                    <td>{{ sala.capacidad }}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" [routerLink]="['/cliente/sala', sala.id]">
                            Ver comentarios
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

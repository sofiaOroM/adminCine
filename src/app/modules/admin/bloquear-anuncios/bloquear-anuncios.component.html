<div class="card shadow-sm p-4 bg-light">
    <h4 class="text-primary mb-3">Bloquear anuncios en mi cine</h4>
    <p>Seleccione cuántos días desea bloquear la publicidad.</p>

    <div class="input-group mb-3">
        <input type="number" [(ngModel)]="dias" min="1" class="form-control">
        <span class="input-group-text">días</span>
    </div>

    <button class="btn btn-danger" (click)="bloquear()">Pagar y bloquear anuncios</button>

    <div class="mt-3 alert alert-info" *ngIf="mensaje">
        {{ mensaje }}
    </div>
</div>

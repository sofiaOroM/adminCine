<div class="card mt-3">
    <div class="card-header bg-primary text-white">
        <h6>Comentarios de la sala</h6>
    </div>
    <div class="card-body">

        <div *ngIf="comentarios.length === 0" class="text-muted">
            No hay comentarios todavía.
        </div>

        <div *ngFor="let c of comentarios" class="border-bottom mb-2 pb-2">
            <strong>{{ c.usuario?.nombre || 'Usuario' }}</strong>
            <span class="text-warning ms-2">★ {{ c.calificacion }}/5</span>
            <p class="m-0">{{ c.comentario }}</p>
            <small class="text-muted">{{ c.fechaComentario | date:'short' }}</small>
        </div>

        <hr>

        <h6>Agregar comentario</h6>
        <textarea [(ngModel)]="nuevoComentario.comentario" class="form-control mb-2"
            placeholder="Escribe tu comentario..."></textarea>

        <div class="mb-2">
            <label>Calificación:</label>
            <select [(ngModel)]="nuevoComentario.calificacion" class="form-select w-auto d-inline ms-2">
                <option *ngFor="let n of [1,2,3,4,5]" [value]="n">{{n}}</option>
            </select>
        </div>

        <button class="btn btn-success btn-sm" (click)="agregarComentario()">Enviar</button>

        <div class="mt-3">
            <strong>Promedio de calificación:</strong> {{ promedio | number:'1.1-1' }}/5
        </div>

    </div>
</div>

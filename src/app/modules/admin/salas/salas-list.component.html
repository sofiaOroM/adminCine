<div class="card shadow-sm p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-primary m-0">Salas registradas</h4>
        <a routerLink="/admin/salas/nueva" class="btn btn-success btn-sm">Nueva sala</a>
    </div>

    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Capacidad</th>
                <th>Descripción</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let s of salas">
                <td>{{ s.id }}</td>
                <td>{{ s.nombre }}</td>
                <td>{{ s.capacidad }}</td>
                <td>{{ s.descripcion }}</td>
                <td class="text-center">
                    <a [routerLink]="['/admin/salas/editar', s.id]" class="btn btn-outline-primary btn-sm me-2">Editar</a>
                    <button class="btn btn-outline-danger btn-sm" (click)="eliminarSala(s.id)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

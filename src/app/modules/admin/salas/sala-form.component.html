<div class="card shadow-sm p-4">
    <h4 class="text-primary mb-3">
        {{ modoEdicion ? 'Editar sala' : 'Nueva sala' }}
    </h4>

    <form (ngSubmit)="guardar()">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" class="form-control" [(ngModel)]="sala.nombre" name="nombre" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacidad:</label>
            <input type="number" class="form-control" [(ngModel)]="sala.capacidad" name="capacidad" required min="1">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <textarea class="form-control" [(ngModel)]="sala.descripcion" name="descripcion"></textarea>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success me-2">Guardar</button>
            <a routerLink="/admin/salas" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

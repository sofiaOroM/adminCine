<div class="card shadow-sm p-4">
    <h4 class="text-primary mb-3">
        {{ modoEdicion ? 'Editar función' : 'Nueva función' }}
    </h4>

    <form (ngSubmit)="guardar()">
        <div class="mb-3">
            <label class="form-label">Película:</label>
            <select class="form-select" [(ngModel)]="funcion.peliculaId" name="peliculaId" required>
                <option value="">Seleccione una...</option>
                <option *ngFor="let p of peliculas" [value]="p.id">{{ p.titulo }}</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Sala:</label>
            <select class="form-select" [(ngModel)]="funcion.salaId" name="salaId" required>
                <option value="">Seleccione una...</option>
                <option *ngFor="let s of salas" [value]="s.id">{{ s.nombre }}</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha:</label>
                <input type="date" class="form-control" [(ngModel)]="funcion.fecha" name="fecha" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Hora:</label>
                <input type="time" class="form-control" [(ngModel)]="funcion.hora" name="hora" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio (Q):</label>
            <input type="number" class="form-control" [(ngModel)]="funcion.precio" name="precio" min="1" required>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success me-2">Guardar</button>
            <button type="button" class="btn btn-secondary" (click)="router.navigate(['/admin/funciones'])">Cancelar</button>
        </div>
    </form>
</div>

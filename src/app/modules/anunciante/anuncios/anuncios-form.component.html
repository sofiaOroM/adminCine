<div class="card shadow-sm p-4 bg-light">
    <h4 class="text-primary mb-4">{{ modoEdicion ? 'Editar anuncio' : 'Nuevo anuncio' }}</h4>

    <form (ngSubmit)="guardar()">
        <div class="mb-3">
            <label class="form-label">Tipo de anuncio:</label>
            <select class="form-select" [(ngModel)]="anuncio.tipo" name="tipo" (change)="calcularPrecio()">
                <option *ngFor="let t of tipos" [value]="t.id">{{ t.nombre }}</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Título:</label>
            <input type="text" class="form-control" [(ngModel)]="anuncio.titulo" name="titulo" required>
        </div>

        <div class="mb-3" *ngIf="anuncio.tipo !== 'video-texto'">
            <label class="form-label">Descripción:</label>
            <textarea class="form-control" rows="3" [(ngModel)]="anuncio.descripcion" name="descripcion"></textarea>
        </div>

        <div class="mb-3" *ngIf="anuncio.tipo === 'texto-imagen'">
            <label class="form-label">URL de imagen:</label>
            <input type="text" class="form-control" [(ngModel)]="anuncio.imagen" name="imagen"
                placeholder="https://...">
        </div>

        <div class="mb-3" *ngIf="anuncio.tipo === 'video-texto'">
            <label class="form-label">Link de video:</label>
            <input type="text" class="form-control" [(ngModel)]="anuncio.videoUrl" name="videoUrl"
                placeholder="https://...">
            <label class="form-label mt-2">Descripción:</label>
            <input type="text" class="form-control" [(ngModel)]="anuncio.descripcion" name="descripcion">
        </div>

        <div class="mb-3">
            <label class="form-label">Duración:</label>
            <select class="form-select" [(ngModel)]="periodo" name="periodo" (change)="calcularPrecio()">
                <option *ngFor="let p of periodos" [value]="p.id">{{ p.nombre }}</option>
            </select>
        </div>

        <div class="alert alert-info" *ngIf="precioCalculado > 0">
            <strong>Precio estimado:</strong> Q {{ precioCalculado }}
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success me-2">Comprar y publicar</button>
            <button type="button" routerLink="/anunciante/anuncios" class="btn btn-secondary">Cancelar</button>
        </div>
    </form>
</div>
